<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>遊戲遠端入口</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f14;
    --panel: #171a22;
    --line: #2a2f3a;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #f0b429;
    --accent-text: #1a1300;
    --warn: #ff8a65;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  main { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
  .card {
    width: min(400px, 100%);
    display: grid;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
  }
  h1 { margin: 0; font-size: 20px; }
  h1.warn { color: var(--warn); }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button, a {
    font: inherit;
    min-height: 44px;
    padding: 0 16px;
    display: inline-flex;
    align-items: center;
    color: var(--text);
    background: #232836;
    border: 1px solid var(--line);
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
  }
  .primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">正在找遊戲電腦…</h1>
    <p id="detail"></p>
    <div id="buttons" class="buttons" hidden>
      <button id="retry" class="primary">重試</button>
      <a id="open">仍要開啟</a>
    </div>
  </div>
</main>
<script>
'use strict';
// This page lives at https://<owner>.github.io/<repo>/; the game PC keeps url.json on the "url" branch.
const OWNER = location.hostname.split('.')[0];
const REPO = location.pathname.split('/')[1];
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/url.json?ref=url`;
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/url/url.json`;
const VALID = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;
const RETRY_MS = 30000;
const $ = (id) => document.getElementById(id);
let timer = null;

function show(title, detail, warn, url) {
  $('title').textContent = title;
  $('title').classList.toggle('warn', warn);
  $('detail').textContent = detail;
  $('buttons').hidden = !warn;
  $('open').hidden = !url;
  if (url) $('open').href = url;
}

async function getJson(url, opts) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch(url, { ...opts, cache: 'no-store', signal: ctl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}

async function readUrl() {
  try {
    return await getJson(API, { headers: { Accept: 'application/vnd.github.raw+json' } });
  } catch {
    // The API allows 60 requests an hour per phone; raw is the fallback (it may lag a few minutes).
    return await getJson(`${RAW}?t=${Date.now()}`);
  }
}

const fmt = (iso) => new Date(iso).toLocaleString('zh-TW', {
  month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
});

async function go() {
  clearTimeout(timer);
  show('正在找遊戲電腦…', '', false);
  let info;
  try {
    info = await readUrl();
  } catch {
    show('讀不到網址', '遊戲電腦還沒送出網址。請在電腦上開 start-remote.bat，開好後這頁會自動找到。', true);
    timer = setTimeout(go, RETRY_MS);
    return;
  }
  if (!VALID.test(info.url || '')) {
    show('網址格式不對', '請在遊戲電腦上重開 start-remote.bat。', true);
    return;
  }
  const url = info.url + '/';
  try {
    await getJson(info.url + '/api/alive');
  } catch {
    show('遊戲電腦目前連不上',
      `網址最後更新：${fmt(info.updated_at)}。電腦可能關機、睡眠，或 start-remote.bat 被關掉了。每 30 秒會自動再試。`,
      true, url);
    timer = setTimeout(go, RETRY_MS);
    return;
  }
  show('找到了，正在進入…', '', false);
  location.replace(url);
}

$('retry').addEventListener('click', go);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('buttons').hidden) go(); });
go();
</script>
</body>
</html>
